name: Skill tests

# Validates the Copilot CLI skills under plugin/ with a deterministic Pester suite
# (bootstrap.ps1 unit tests + SKILL.md lint + evals/evals.json schema check). No LLM,
# no secrets, runs on Windows. Intended as a REQUIRED PR check.
#
# The live behavioral evals (evals/evals.json) are NOT run in CI — they follow the
# skill-creator convention (with-skill vs baseline subagents graded by an LLM) and are
# run on demand via the skill-creator skill, not the pipeline.

on:
  push:
    branches: [ "main" ]
    paths:
      - "plugin/**"
      - ".github/workflows/skill-tests.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "plugin/**"
      - ".github/workflows/skill-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic (Pester)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Pester 5
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0.0')) {
            Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.0.0
          (Get-Module Pester).Version.ToString()

      - name: Run deterministic skill tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testDirs = Get-ChildItem -Path './plugin' -Directory -Recurse |
            Where-Object { $_.Name -eq 'tests' -and (Get-ChildItem $_.FullName -Filter '*.Tests.ps1') }
          if (-not $testDirs) { throw "No skill 'tests' folders with *.Tests.ps1 found under ./plugin." }

          $cfg = New-PesterConfiguration
          $cfg.Run.Path        = $testDirs.FullName
          $cfg.Run.Throw       = $true          # non-zero exit if any test fails
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled    = $true
          $cfg.TestResult.OutputPath = 'pester-results.xml'
          Invoke-Pester -Configuration $cfg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pester-results
          path: pester-results.xml
          if-no-files-found: ignore
